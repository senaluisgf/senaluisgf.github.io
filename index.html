<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luis Sena - Portfolio</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/about.css">
  <link rel="stylesheet" href="./css/services.css">
  <link rel="stylesheet" href="./css/portfolio.css">
  <link rel="stylesheet" href="./css/contact.css">
  <link rel="stylesheet" href="./css/responsive.css">
  
  <!-- style switcher -->
  <link rel="stylesheet" href="./css/skins/style-switcher.css">
  <link rel="stylesheet" href="./css/skins/color-1.css" class="alternate-style" title="color-1" disabled>
  <link rel="stylesheet" href="./css/skins/color-2.css" class="alternate-style" title="color-2" disabled>
  <link rel="stylesheet" href="./css/skins/color-3.css" class="alternate-style" title="color-3" disabled>
  <link rel="stylesheet" href="./css/skins/color-4.css" class="alternate-style" title="color-4">
  <link rel="stylesheet" href="./css/skins/color-5.css" class="alternate-style" title="color-5" disabled>

  <!-- External Libs -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />
</head>

<body class="dark">
  <div class="main-container">
    <nav class="side-bar">
      <div class="logo">
        <a href="#home"><span>S</span>ena</a>
      </div>
      <div class="nav-toggler">
        <span></span>
      </div>
      <ul class="nav-list">
        <li><a href="#home" class="active"><i class="fa fa-home"></i> <span data-i18n="nav.home"></span></a></li>
        <li><a href="#about"><i class="fa fa-user"></i><span data-i18n="nav.about"></span></a></li>
        <li><a href="#services"><i class="fa fa-list"></i> <span data-i18n="nav.services"></span></a></li>
        <li><a href="#portfolio"><i class="fa fa-briefcase"></i> <span data-i18n="nav.portfolio"></span></a></li>
        <li><a href="#contact"><i class="fa fa-comments"></i> <span data-i18n="nav.contact"></span></a></li>
      </ul>
    </nav>

    <div class="main-content">
      <section class="home active" id="home"></section>
      <section class="about" id="about"></section>
      <section class="services" id="services"></section>
      <section class="portfolio" id="portfolio"></section>
      <section class="contact" id="contact"></section>
    </div>

    <div class="style-switcher">
      <div class="style-switcher-toggler s-icon">
        <i class="fas fa-cog fa-spin"></i>
      </div>
      <div class="day-night s-icon">
        <i class="fas fa-sun"></i>
      </div>

      <h4>Languages</h4>
      <div class="language-switcher">
        <span class="fi fi-gb" onclick="setLanguage('en')"></span>
        <span class="fi fi-fr" onclick="setLanguage('fr')"></span>
        <span class="fi fi-br" onclick="setLanguage('pt-br')"></span>
      </div>

      <h4>Theme Colors</h4>
      <div class="colors">
        <span class="color-1" onclick="setThemeColor('color-1')"></span>
        <span class="color-2" onclick="setThemeColor('color-2')"></span>
        <span class="color-3" onclick="setThemeColor('color-3')"></span>
        <span class="color-4" onclick="setThemeColor('color-4')"></span>
        <span class="color-5" onclick="setThemeColor('color-5')"></span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.1.0/typed.umd.js"
    integrity="sha512-+2pW8xXU/rNr7VS+H62aqapfRpqFwnSQh9ap6THjsm41AxgA0MhFRtfrABS+Lx2KHJn82UOrnBKhjZOXpom2LQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="./js/script.js"></script>
  <script src="./js/style-switcher.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/load-section.js"></script>
</body>

</html>
